<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Shop</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #f3f5f9;
        color: #1b2233;
      }
      header {
        background: #1b2233;
        color: #fff;
        padding: 14px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        font-size: 20px;
        margin: 0;
      }
      main {
        max-width: 760px;
        margin: 32px auto;
        padding: 0 16px;
      }
      .card {
        background: #fff;
        border: 1px solid #dde2ec;
        border-radius: 10px;
        padding: 24px;
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 14px;
      }
      input {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 9px 11px;
        font-size: 15px;
        border: 1px solid #c9d0dc;
        border-radius: 6px;
      }
      button {
        font-size: 14px;
        font-weight: 600;
        padding: 9px 16px;
        border-radius: 6px;
        border: 0;
        background: #3346d3;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        background: #a9b1c6;
        cursor: not-allowed;
      }
      button.secondary {
        background: #fff;
        color: #3346d3;
        border: 1px solid #3346d3;
      }
      .error {
        background: #fbe4e7;
        color: #a3192a;
        padding: 9px 12px;
        border-radius: 6px;
        margin-bottom: 14px;
        font-size: 14px;
      }
      .products {
        display: grid;
        gap: 10px;
      }
      .product {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border: 1px solid #dde2ec;
        border-radius: 8px;
      }
      .price {
        color: #5a6478;
        font-size: 14px;
      }
      .cart-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .order {
        padding: 8px 0;
        border-bottom: 1px solid #eef0f5;
      }
      .muted {
        color: #5a6478;
        font-size: 14px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>QA Shop</h1>
      <!-- Only visible after login -->
      <button id="logout" class="secondary" hidden>Log out</button>
    </header>

    <main>
      <!-- ================= LOGIN SCREEN ================= -->
      <section id="login-screen" class="card">
        <h2>Sign in</h2>

        <!-- Error message area. role="alert" makes screen readers announce it. -->
        <div id="login-error" class="error" role="alert" hidden></div>

        <form id="login-form" novalidate>
          <label>
            Email
            <input
              id="email"
              type="email"
              autocomplete="off"
              placeholder="you@example.com"
            />
          </label>
          <label>
            Password
            <input id="password" type="password" autocomplete="off" />
          </label>
          <!-- Disabled until both fields have text -->
          <button id="sign-in" type="submit" disabled>Sign in</button>
        </form>
        <p class="muted">Test account: qa@shop.test / Password123</p>
      </section>

      <!-- ================= DASHBOARD ================= -->
      <section id="dashboard" hidden>
        <div class="card">
          <h2 id="welcome"></h2>
          <div class="cart-bar">
            <span
              >Cart: <strong id="cart-count">0</strong> items · Total:
              <strong id="cart-total">$0.00</strong></span
            >
            <button id="clear-cart" class="secondary">Clear cart</button>
          </div>
        </div>

        <div class="card">
          <h2>Products</h2>
          <div class="products" id="products"></div>
        </div>

        <div class="card">
          <h2>My orders</h2>
          <button id="load-orders">Load orders</button>
          <p id="orders-status" class="muted"></p>
          <div id="orders"></div>
        </div>
      </section>
    </main>

    <script>
      const VALID_EMAIL = "qa@shop.test";
      const VALID_PASSWORD = "Password123";

      const PRODUCTS = [
        { id: "lamp", name: "Desk lamp", price: 38.0 },
        { id: "cable", name: "USB-C cable", price: 12.5 },
        { id: "notebook", name: "Notebook", price: 4.99 },
      ];

      let cart = []; // list of product objects in the cart

      // Shortcut for getElementById
      const el = (id) => document.getElementById(id);

      // ----- Login -----

      // Enable "Sign in" only when both fields have something typed.
      function updateSignInButton() {
        el("sign-in").disabled = !(el("email").value && el("password").value);
      }
      el("email").addEventListener("input", updateSignInButton);
      el("password").addEventListener("input", updateSignInButton);

      function showError(message) {
        el("login-error").textContent = message;
        el("login-error").hidden = false;
      }

      el("login-form").addEventListener("submit", (event) => {
        event.preventDefault(); // stop the browser from reloading the page
        el("login-error").hidden = true;

        const email = el("email").value.trim();
        const password = el("password").value;

        // Simple email format check
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
          showError("Enter a valid email");
          return;
        }

        // Pretend to call a server: takes half a second.
        el("sign-in").disabled = true;
        el("sign-in").textContent = "Signing in...";

        setTimeout(() => {
          el("sign-in").textContent = "Sign in";
          updateSignInButton();

          if (
            email.toLowerCase() === VALID_EMAIL &&
            password === VALID_PASSWORD
          ) {
            showDashboard();
          } else {
            showError("Invalid email or password");
          }
        }, 500);
      });

      // ----- Dashboard -----

      function showDashboard() {
        el("login-screen").hidden = true;
        el("dashboard").hidden = false;
        el("logout").hidden = false;
        el("welcome").textContent = "Welcome, QA Tester";
        renderCart();
      }

      // Build the product list from the PRODUCTS array.
      el("products").innerHTML = PRODUCTS.map(
        (p) => `
      <div class="product" data-product="${p.id}">
        <div>
          <strong>${p.name}</strong>
          <div class="price">$${p.price.toFixed(2)}</div>
        </div>
        <button class="add-to-cart" data-id="${p.id}">Add to cart</button>
      </div>
    `,
      ).join("");

      el("products").addEventListener("click", (event) => {
        const button = event.target.closest(".add-to-cart");
        if (!button) return;
        const product = PRODUCTS.find((p) => p.id === button.dataset.id);
        cart.push(product);
        renderCart();
      });

      function renderCart() {
        const total = cart.reduce((sum, p) => sum + p.price, 0);
        el("cart-count").textContent = cart.length;
        el("cart-total").textContent = "$" + total.toFixed(2);
      }

      el("clear-cart").addEventListener("click", () => {
        cart = [];
        renderCart();
      });

      // ----- Orders (slow, like a real server) -----

      el("load-orders").addEventListener("click", () => {
        el("orders").innerHTML = "";
        el("orders-status").textContent = "Loading...";

        const delay = 300 + Math.random() * 1200; // 0.3 to 1.5 seconds
        setTimeout(() => {
          el("orders-status").textContent = "";
          el("orders").innerHTML = `
          <div class="order">#1042 · Desk lamp · Delivered</div>
          <div class="order">#1043 · USB-C cable · On the way</div>
          <div class="order">#1044 · Notebook · Processing</div>
        `;
        }, delay);
      });

      // ----- Logout -----

      el("logout").addEventListener("click", () => {
        cart = [];
        el("dashboard").hidden = true;
        el("logout").hidden = true;
        el("login-screen").hidden = false;
        el("orders").innerHTML = "";
        el("password").value = ""; // never keep the password after logout
        el("login-error").hidden = true;
        updateSignInButton();
      });

      if (location.search.includes("test")) {
        const script = document.createElement("script");
        script.src = "ui-tests.js";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
